name: Build APK v3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f NothingLauncher.zip ]; then
            mkdir -p _proj
            unzip -o NothingLauncher.zip -d _proj
            echo "Archive extracted to _proj"
          else
            echo "No NothingLauncher.zip found, assuming project is in root."
          fi

      - name: Find project
        id: find
        run: |
          # Ищем файл settings.gradle (или .kts), чтобы найти корень проекта
          F=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle(.kts) NOT FOUND. Check your archive structure."
            ls -R | head -n 50
            exit 1
          fi
          # Убираем './' из начала пути, если он есть
          DIR=$(dirname "$F" | sed 's|^\./||')
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Project directory found at: $DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      # Проверяем, что APK действительно создался, и выводим его путь
      - name: Verify APK exists
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "Looking for APK in: $(pwd)"
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-APK
          # Используем путь от корня рабочей области GitHub
          path: ${{ github.workspace }}/${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
